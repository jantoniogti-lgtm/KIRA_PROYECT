function clients(){let q=document.getElementById('q')?.value.toLowerCase()||'',m=document.getElementById('month')?.value||'',st=document.getElementById('status')?.value||'all',cl=document.getElementById('classificationFilter')?.value||'all';let list=db.clients.filter(c=>(`${c.name} ${c.phone} ${c.mac} ${c.mac2}`.toLowerCase().includes(q))&&(!m||c.end?.startsWith(m))&&(st==='all'||c.status===st)&&(cl==='all'||(c.classification||'')===cl));return header('Clientes','Listado importado · edición y contacto individual o múltiple',`<button onclick="exportClients()">↧ Exportar CSV</button><button class="primary" onclick="openClient()">＋ Añadir cliente</button>`)
+`<section class="panel"><div class="filters"><input id="q" placeholder="Buscar cliente, teléfono, MAC…" oninput="renderClients()" value="${esc(q)}"><input id="month" type="month" min="2027-01" max="2027-12" value="${esc(m)}" onchange="renderClients()"><select id="status" onchange="renderClients()"><option value="all">Todos los estados</option><option ${st==='Activo'?'selected':''}>Activo</option><option ${st==='Baja'?'selected':''}>Baja</option></select><select id="classificationFilter" onchange="renderClients()"><option value="all">Todos los tipos</option><option value="nuevo" ${cl==='nuevo'?'selected':''}>Nuevo</option><option value="renovado" ${cl==='renovado'?'selected':''}>Renovado</option><option value="baja" ${cl==='baja'?'selected':''}>Baja</option><option value="gratis" ${cl==='gratis'?'selected':''}>Gratis</option><option value="" ${cl===''?'selected':''}>Sin clasificar</option></select><button onclick="clearFilters()">Limpiar</button></div><div class="panelhead"><label class="selectall"><input type="checkbox" id="allcheck" onchange="selectVisible()"> Seleccionar visibles (${list.length})</label><button class="green" onclick="openBulkWhatsApp()">◉ WhatsApp selección (${selected.size})</button><select id="bulkClassification" style="width:auto;min-width:130px"><option value="">Tipo masivo…</option><option value="nuevo">Nuevo</option><option value="renovado">Renovado</option><option value="baja">Baja</option><option value="gratis">Gratis</option></select><button class="primary" onclick="applyBulkClassification()">Aplicar tipo</button></div><div class="tablewrap"><table><thead><tr><th></th><th>Cliente</th><th>Teléfono</th><th>Fecha alta</th><th>Caducidad</th><th>Precio</th><th>Tipo</th><th>Estado</th><th>Acciones</th></tr></thead><tbody>${list.map(c=>`<tr><td><input type="checkbox" ${selected.has(c.id)?'checked':''} onchange="toggleSelect(${c.id},this.checked)" style="width:auto"></td><td><b>${esc(c.name)}</b><div class="muted" style="font-size:11px">${esc(c.mac||'MAC no indicada')}</div></td><td>${c.phone?`<span class="phone">${esc(c.phone)}</span>`:'<span class="muted">Sin teléfono</span>'}</td><td>${esc(c.start||'—')}</td><td>${esc(c.end||'—')}</td><td>${money(c.price)}</td><td>${({nuevo:'🟢 NUEVO',renovado:'🟡 RENOVADO',baja:'🔴 BAJA',gratis:'🎁 GRATIS'})[c.classification]||'—'}</td><td><span class="pill ${c.status==='Baja'?'expired':''}">${esc(c.status||'Activo')}</span></td><td><div class="rowactions"><button title="WhatsApp" class="green" onclick="whatsappOne(${c.id})">◉</button><button title="Editar" onclick="openClient(${c.id})">✎</button></div></td></tr>`).join('')||`<tr><td colspan="9" class="empty">No hay clientes con esos filtros.</td></tr>`}</tbody></table></div><p class="muted" style="font-size:12px">Selecciona los clientes y prepara un mensaje común. WhatsApp requiere que confirmes cada conversación/envío.</p></section>`}
function renderClients(){let keepQ=document.getElementById('q')?.value,keepM=document.getElementById('month')?.value,keepS=document.getElementById('status')?.value,keepC=document.getElementById('classificationFilter')?.value;document.getElementById('main').innerHTML=clients();if(keepQ!==undefined){document.getElementById('q').value=keepQ;document.getElementById('month').value=keepM;document.getElementById('status').value=keepS;document.getElementById('classificationFilter').value=keepC}}
function clearFilters(){render();go('clients')}
function selectVisible(){let q=document.getElementById('q').value.toLowerCase(),m=document.getElementById('month').value,st=document.getElementById('status').value,cl=document.getElementById('classificationFilter').value;db.clients.filter(c=>`${c.name} ${c.phone} ${c.mac} ${c.mac2}`.toLowerCase().includes(q)&&(!m||c.end?.startsWith(m))&&(st==='all'||c.status===st)&&(cl==='all'||(c.classification||'')===cl)).forEach(c=>selected.add(c.id));render()}
function toggleSelect(id,on){on?selected.add(id):selected.delete(id);render()}
function localISODate(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function openClient(id){const editing=id!==undefined&&id!==null&&id!==0;let c=editing?db.clients.find(x=>String(x.id)===String(id)):null;if(editing&&!c){toast('No se ha encontrado el cliente para editar');return}const today=localISODate();c=c||{id:Date.now(),name:'',phone:'',start:today,end:'',mac:'',mac2:'',price:0,status:'Activo',classification:''};const cls=c.classification||((c.status==='Baja')?'baja':'');document.getElementById('modal').innerHTML=`<h2>${editing?'✎ Editar cliente':'＋ Nuevo cliente'}</h2><div class="formgrid">${field('Nombre usuario','name',c.name)}${field('Teléfono WhatsApp','phone',c.phone,'tel')}${field('Fecha alta','start',c.start||today,'date')}${field('Fecha caducidad','end',c.end||'','date')}${field('MAC / dispositivo','mac',c.mac)}${field('MAC secundaria','mac2',c.mac2)}${field('Precio (€)','price',c.price,'number')}<div class="field"><label>Tipo de cliente / clasificación 2027</label><select id="f-classification"><option value="" ${!cls?'selected':''}>Sin clasificar</option><option value="nuevo" ${cls==='nuevo'?'selected':''}>🟢 Nuevo</option><option value="renovado" ${cls==='renovado'?'selected':''}>🟡 Renovado</option><option value="baja" ${cls==='baja'?'selected':''}>🔴 Baja</option><option value="gratis" ${cls==='gratis'?'selected':''}>🎁 Gratis</option></select></div></div><div class="modalfoot"><button type="button" onclick="closeModal()">Cancelar</button><button type="button" class="primary" onclick="saveClient('${editing?String(id):0}')">Guardar cliente</button></div>`;openModal()}
function field(label,key,val,type='text'){return `<div class="field"><label>${label}</label><input id="f-${key}" type="${type}" value="${esc(val)}"></div>`}
function saveClient(id){try{const isEditing=id!==undefined&&id!==null&&id!==0&&id!=='0';const old=isEditing?db.clients.find(x=>String(x.id)===String(id)):null;if(isEditing&&!old){toast('Error: cliente no encontrado. No se ha guardado.');return}const classification=document.getElementById('f-classification').value;const c={id:old?old.id:(Date.now()),name:document.getElementById('f-name').value.trim(),phone:document.getElementById('f-phone').value.trim(),start:document.getElementById('f-start').value||localISODate(),end:document.getElementById('f-end').value,mac:document.getElementById('f-mac').value.trim(),mac2:document.getElementById('f-mac2').value.trim(),price:classification==='gratis'?0:(Number(document.getElementById('f-price').value)||0),classification,status:classification==='baja'?'Baja':'Activo'};if(!c.name){toast('Indica el nombre del cliente');document.getElementById('f-name').focus();return}if(old){const index=db.clients.findIndex(x=>String(x.id)===String(old.id));db.clients[index]=c}else db.clients.push(c);if(!saveDb())return;closeModal();render();toast(old?'Cliente actualizado y guardado':'Nuevo cliente guardado')}catch(err){console.error('saveClient failed',err);toast('Error al guardar: '+(err.message||'revisa los campos'))}}
function applyBulkClassification(){const type=document.getElementById('bulkClassification')?.value;const ids=[...selected];if(!type){toast('Elige un tipo para aplicar');return}if(!ids.length){toast('Selecciona clientes con las casillas');return}if(!confirm('¿Aplicar '+type.toUpperCase()+' a '+ids.length+' clientes seleccionados?'))return;const prior=db.clients.map(c=>({...c}));db.clients.forEach(c=>{if(selected.has(c.id)){c.classification=type;c.status=type==='baja'?'Baja':'Activo';if(type==='gratis')c.price=0}});if(!saveDb()){db.clients=prior;return}render();toast('Clasificación aplicada a '+ids.length+' clientes')}
function whatsappLink(c,msg){let phone=(c.phone||'').replace(/\D/g,'');if(phone.startsWith('00'))phone=phone.slice(2);if(phone.length===9)phone='34'+phone;return phone?`https://wa.me/${phone}?text=${encodeURIComponent(msg.replaceAll('{nombre}',c.name))}`:''}
function whatsappOne(id){let c=db.clients.find(c=>c.id===id);if(!c?.phone){toast('Añade primero el teléfono en la ficha');return}let msg='Hola {nombre}, te contactamos desde KIRA.';window.open(whatsappLink(c,msg),'_blank')}
function openBulkWhatsApp(){let chosen=db.clients.filter(c=>selected.has(c.id));if(!chosen.length){toast('Selecciona al menos un cliente');return}let withPhone=chosen.filter(c=>c.phone);document.getElementById('modal').innerHTML=`<h2>WhatsApp a varios clientes</h2><p class="muted">${chosen.length} seleccionados · ${withPhone.length} con teléfono</p><div class="field"><label>Mensaje (usa {nombre} para personalizar)</label><textarea id="bulkmsg" rows="5">Hola {nombre}, te contactamos desde KIRA.</textarea></div><div class="modalfoot"><button onclick="closeModal()">Cancelar</button><button class="green" onclick="launchBulk()">Abrir conversaciones (${withPhone.length})</button></div><p class="muted" style="font-size:12px">Se abrirán las conversaciones en WhatsApp. La aplicación no realiza envíos automáticos.</p>`;openModal()}
function launchBulk(){let msg=document.getElementById('bulkmsg').value,chosen=db.clients.filter(c=>selected.has(c.id)&&c.phone);if(!chosen.length){toast('La selección no tiene teléfonos');return}chosen.forEach((c,i)=>{let url=whatsappLink(c,msg);if(url)setTimeout(()=>window.open(url,'_blank'),i*450)});closeModal();toast('Conversaciones preparadas; confirma los mensajes en WhatsApp')}
function finance(){let income=db.income.reduce((s,x)=>s+Number(x.amount||0),0),expenses=db.expenses.reduce((s,x)=>s+Number(x.amount||0),0);return header('Finanzas 2027','Registro financiero nuevo · cifras inicializadas a cero',`<button onclick="addFinance('expense')">＋ Añadir gasto</button><button class="primary" onclick="addFinance('income')">＋ Añadir ingreso</button>`)+`<section class="cards">${metric('INGRESOS',money(income),'Entradas registradas','green')}${metric('GASTOS',money(expenses),'Salidas registradas','red')}${metric('BENEFICIO',money(income-expenses),'Ingresos menos gastos','orange')}${metric('MOVIMIENTOS',db.income.length+db.expenses.length,'Registros de 2027','blue')}</section><section class="panel"><div class="panelhead"><h2>Movimientos recientes</h2></div><div class="tablewrap"><table><thead><tr><th>Fecha</th><th>Concepto</th><th>Tipo</th><th>Importe</th><th></th></tr></thead><tbody>${[...db.income.map(x=>({...x,type:'Ingreso'})),...db.expenses.map(x=>({...x,type:'Gasto'}))].sort((a,b)=>b.date.localeCompare(a.date)).map(x=>`<tr><td>${esc(x.date)}</td><td>${esc(x.label)}</td><td>${x.type}</td><td>${money(x.amount)}</td><td><button class="danger" onclick="deleteFinance('${x.id}','${x.type}')">Eliminar</button></td></tr>`).join('')||'<tr><td colspan="5" class="empty">Todavía no hay movimientos. El año financiero comienza a cero.</td></tr>'}</tbody></table></div></section>`}
function addFinance(type){document.getElementById('modal').innerHTML=`<h2>Nuevo ${type==='income'?'ingreso':'gasto'}</h2><div class="formgrid">${field('Fecha','date','2027-01-01','date')}${field('Concepto','label','')}${field('Importe (€)','amount','','number')}</div><div class="modalfoot"><button onclick="closeModal()">Cancelar</button><button class="primary" onclick="saveFinance('${type}')">Guardar</button></div>`;openModal()}
function saveFinance(type){let x={id:String(Date.now()),date:document.getElementById('f-date').value,label:document.getElementById('f-label').value.trim(),amount:Number(document.getElementById('f-amount').value)||0};(type==='income'?db.income:db.expenses).push(x);saveDb();closeModal();render()}
function deleteFinance(id,type){if(!confirm('¿Eliminar movimiento?'))return;(type==='Ingreso'?db.income:db.expenses).splice((type==='Ingreso'?db.income:db.expenses).findIndex(x=>x.id===id),1);saveDb();render()}
function credits(){let total=db.creditBuys.reduce((s,x)=>s+Number(x.credits||0),0),paid=db.creditBuys.reduce((s,x)=>s+Number(x.paid||0),0);return header('Créditos','Control de compras de créditos · nueva contabilidad 2027',`<button class="primary" onclick="addCredit()">＋ Compra de créditos</button>`)+`<section class="cards">${metric('CRÉDITOS COMPRADOS',total,'Acumulado de compras','orange')}${metric('IMPORTE PAGADO',money(paid),'Gasto de créditos','yellow')}${metric('COMPRAS',db.creditBuys.length,'Registros','blue')}${metric('SALDO INICIAL','0','Empieza sin saldo previo','green')}</section><section class="panel"><div class="panelhead"><h2>Historial de compras</h2></div><div class="tablewrap"><table><thead><tr><th>Fecha</th><th>Pagado</th><th>Créditos</th><th>Líneas</th><th></th></tr></thead><tbody>${db.creditBuys.map(x=>`<tr><td>${esc(x.date)}</td><td>${money(x.paid)}</td><td>${x.credits}</td><td>${x.lines}</td><td><button class="danger" onclick="delCredit('${x.id}')">Eliminar</button></td></tr>`).join('')||'<tr><td colspan="5" class="empty">Sin compras todavía.</td></tr>'}</tbody></table></div></section>`}
function addCredit(){document.getElementById('modal').innerHTML=`<h2>Registrar compra de créditos</h2><div class="formgrid">${field('Fecha','date','2027-01-01','date')}${field('Importe pagado (€)','paid','','number')}${field('Créditos recibidos','credits','','number')}${field('Líneas','lines','','number')}</div><div class="modalfoot"><button onclick="closeModal()">Cancelar</button><button class="primary" onclick="saveCredit()">Guardar</button></div>`;openModal()}
function saveCredit(){db.creditBuys.push({id:String(Date.now()),date:document.getElementById('f-date').value,paid:Number(document.getElementById('f-paid').value)||0,credits:Number(document.getElementById('f-credits').value)||0,lines:Number(document.getElementById('f-lines').value)||0});saveDb();closeModal();render()}
function delCredit(id){if(confirm('¿Eliminar compra?')){db.creditBuys=db.creditBuys.filter(x=>x.id!==id);saveDb();render()}}
function whatsapp(){return header('WhatsApp','Selecciona clientes desde la tabla para iniciar mensajes segmentados',`<button onclick="go('clients')">Elegir clientes →</button>`)+`<section class="panel"><h2>Mensajes a varios destinatarios</h2><p class="muted">Entra en Clientes, marca los contactos y pulsa “WhatsApp selección”. Se abrirán los chats con el mensaje preparado y nombre personalizado. Por seguridad y las restricciones de WhatsApp, tendrás que confirmar el envío dentro de la aplicación.</p><button class="green" onclick="go('clients')">◉ Ir a seleccionar clientes</button></section>`}
function settings(){return header('Datos y copias','Gestiona los datos guardados en este navegador',`<button onclick="exportBackup()">↧ Exportar copia JSON</button><button onclick="document.getElementById('importfile').click()">↥ Importar copia</button>`)+`<section class="panel"><h2>Datos de la aplicación</h2><p>Este proyecto es un nuevo ciclo 2027. Los clientes se han importado desde el Excel de partida; la contabilidad, movimientos y compras de créditos se inician vacíos.</p><p class="muted">Los datos se guardan en el almacenamiento local de este navegador. Haz copias periódicas si usas el sistema en un solo dispositivo.</p><div style="display:flex;gap:10px;flex-wrap:wrap"><button onclick="exportBackup()">Descargar copia JSON</button><button onclick="exportClients()">Exportar clientes CSV</button><button class="danger" onclick="resetFinance()">Reiniciar solo finanzas 2027</button></div><input id="importfile" type="file" accept=".json" style="display:none" onchange="importBackup(event)"></section><section class="panel" style="margin-top:14px"><h2>Reinicio de datos</h2><p class="muted">Esto restablece los clientes a la importación inicial del Excel y elimina cambios y datos financieros guardados en esta instancia.</p><button class="danger" onclick="resetAll()">Restaurar todo desde el Excel</button></section>`}
function resetFinance(){if(confirm('¿Borrar todos los ingresos, gastos y compras de créditos?')){db.income=[];db.expenses=[];db.creditBuys=[];saveDb();render()}}
function resetAll(){if(confirm('ATENCIÓN: se borrarán cambios, contactos añadidos y finanzas guardadas. ¿Restaurar el estado inicial?')){db=loadDbInitial();selected.clear();saveDb();render()}}
function loadDbInitial(){return {year:2027,clients:SEED_CLIENTS.map(x=>({...x})),income:[],expenses:[],creditBuys:[],settings:{}}}
function exportBackup(){download('KIRA_CONTROL_2027_COPIA.json',JSON.stringify(db,null,2),'application/json')}
function importBackup(e){let f=e.target.files[0];if(!f)return;let reader=new FileReader();reader.onload=()=>{try{let x=JSON.parse(reader.result);if(!x.clients)throw Error();db=x;saveDb();render();toast('Copia importada')}catch(err){alert('Archivo de copia no válido')}};reader.readAsText(f)}
function exportClients(){let rows=[['Id','Cliente','Telefono','Fecha alta','Caducidad','MAC','MAC2','Precio','Estado'],...db.clients.map(c=>[c.id,c.name,c.phone,c.start,c.end,c.mac,c.mac2,c.price,c.status])];download('KIRA_CLIENTES_2027.csv',rows.map(r=>r.map(v=>`"${String(v??'').replaceAll('"','""')}"`).join(';')).join('\r\n'),'text/csv;charset=utf-8')}
function download(name,data,type){let a=document.createElement('a'),u=URL.createObjectURL(new Blob([data],{type}));a.href=u;a.download=name;a.click();URL.revokeObjectURL(u)}
function openModal(){document.getElementById('modalback').style.display='flex'}function closeModal(){document.getElementById('modalback').style.display='none'}
document.getElementById('modalback').onclick=e=>{if(e.target.id==='modalback')closeModal()}
function render(){document.getElementById('main').innerHTML=({dashboard,clients,finance,credits,whatsapp,settings}[page]||dashboard)();if(page==='dashboard')drawChart()}
window.addEventListener('resize',()=>{if(page==='dashboard')drawChart()});
render();
initCloud();
</script></body></html>
