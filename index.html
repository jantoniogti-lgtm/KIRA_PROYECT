const BACKUP_KEY='kira-control-backups-v1';
const ACTIVITY_KEY='kira-control-activity-v1';
function getBackups(){try{return JSON.parse(localStorage.getItem(BACKUP_KEY)||'[]')||[]}catch(e){return []}}
function createAutoBackup(){try{const list=getBackups();list.unshift({date:new Date().toISOString(),state:JSON.parse(JSON.stringify(state))});localStorage.setItem(BACKUP_KEY,JSON.stringify(list.slice(0,5)));}catch(e){console.warn(e)}}

async function firebasePullNow(){if(!firebaseReady){toast('Firebase aún no está conectado');return}if(!confirm('¿Descargar los datos de Firebase y sustituir los datos actuales?'))return;try{const snap=await kiraRef.once('value');if(snap.exists()){createAutoBackup();state=snap.val();state.credits=Array.isArray(state.credits)?state.credits:[];state.renewalHistory=Array.isArray(state.renewalHistory)?state.renewalHistory:[];state.viewPrefs=state.viewPrefs||{};state.meta=state.meta||{};localStorage.setItem('kira-control-v7',JSON.stringify(state));logActivity('☁️ Datos descargados desde Firebase','sync');toast('Datos descargados de Firebase');render('dashboard')}}catch(e){toast('No se pudieron descargar los datos')}}
function save(){
  createAutoBackup();
  logActivity('💾 Datos guardados','save');
  state.meta=state.meta||{};
  state.meta.updatedAt=Date.now();
  localStorage.setItem('kira-control-v7',JSON.stringify(state));
  if(firebaseReady){
    return kiraRef.set(state).then(()=>{setFirebaseStatus('☁️ Guardado en Firebase');return true}).catch(e=>{console.error(e);setFirebaseStatus('⚠️ Error Firebase');return false});
  }
  return Promise.resolve(true);
}
function setFirebaseStatus(t){let x=document.getElementById('firebaseStatus');if(x)x.textContent=t}
async function initFirebase(){
 try{
   setFirebaseStatus('☁️ Conectando con Firebase...');
   const snap=await kiraRef.once('value');
   const localState=state;
   const remote=snap.exists()?(snap.val()||{}):null;
   if(!remote){
     localState.meta=localState.meta||{};
     localState.meta.dataVersion=DATA_VERSION;
     localState.meta.updatedAt=Date.now();
     await kiraRef.set(localState);
     setFirebaseStatus('☁️ Datos Excel V3 subidos a Firebase');
   }else if(remote.meta?.dataVersion!==DATA_VERSION){
     // El Excel V3 es ahora la fuente de datos de clientes, créditos y ventas.
     // Conservamos únicamente el historial de renovaciones y preferencias de la versión anterior.
     const fresh=JSON.parse(JSON.stringify(DATA));
     fresh.renewalHistory=Array.isArray(remote.renewalHistory)?remote.renewalHistory:(Array.isArray(localState.renewalHistory)?localState.renewalHistory:[]);
     fresh.viewPrefs=localState.viewPrefs||remote.viewPrefs||{};
     fresh.meta=fresh.meta||{};
     fresh.meta.dataVersion=DATA_VERSION;
     fresh.meta.updatedAt=Date.now();
     state=fresh;
     localStorage.setItem('kira-control-v7',JSON.stringify(state));
     await kiraRef.set(state);
     setFirebaseStatus('☁️ Excel V3 aplicado · Firebase actualizado');
   }else{
     const localUpdated=Number(localState.meta?.updatedAt||0);
     const remoteUpdated=Number(remote.meta?.updatedAt||0);
     if(localUpdated>remoteUpdated){
       await kiraRef.set(localState);
       setFirebaseStatus('☁️ Cambios locales sincronizados');
     }else{
       state=remote;
       state.users=Array.isArray(state.users)?state.users:[];
       state.freeUsers=Array.isArray(state.freeUsers)?state.freeUsers:[];
       state.credits=Array.isArray(state.credits)?state.credits:[];
       state.renewalHistory=Array.isArray(state.renewalHistory)?state.renewalHistory:[];
       state.viewPrefs=state.viewPrefs||{};
       state.meta=state.meta||{};
       state.creditTotals=state.creditTotals||{paid:0,credits:0,lines:0,avgCredit:0,avgLine:0};
       localStorage.setItem('kira-control-v7',JSON.stringify(state));
       setFirebaseStatus('☁️ Conectado · datos de Firebase');
     }
   }
   firebaseReady=true;
   firebaseLoaded=true;
   kiraRef.on('value',snap=>{
     if(!snap.exists())return;
     const incoming=snap.val()||{};
     if(incoming.meta?.dataVersion!==DATA_VERSION)return;
     incoming.users=Array.isArray(incoming.users)?incoming.users:[];
     incoming.freeUsers=Array.isArray(incoming.freeUsers)?incoming.freeUsers:[];
     incoming.credits=Array.isArray(incoming.credits)?incoming.credits:[];
     incoming.renewalHistory=Array.isArray(incoming.renewalHistory)?incoming.renewalHistory:[];
     incoming.viewPrefs=incoming.viewPrefs||{};
     incoming.meta=incoming.meta||{};
     incoming.creditTotals=incoming.creditTotals||{paid:0,credits:0,lines:0,avgCredit:0,avgLine:0};
     const currentUpdated=Number(state.meta?.updatedAt||0);
     const incomingUpdated=Number(incoming.meta?.updatedAt||0);
     if(currentUpdated>incomingUpdated) return;
     state=incoming;
     localStorage.setItem('kira-control-v7',JSON.stringify(state));
     setFirebaseStatus('☁️ Sincronizado');
     const active=document.querySelector('.nav button.active,[data-page].active');
     const page=active?.dataset?.page||'dashboard';
     render(page);
   });
 }catch(e){
   console.error(e);
   setFirebaseStatus('⚠️ Firebase no disponible · modo local');
   firebaseReady=false;
 }
 render(uiState.page||'dashboard');
}

function addMonthsToDate(dateStr, months){
 const parts=String(dateStr||'').slice(0,10).split('-').map(Number);
 if(parts.length!==3 || parts.some(n=>!Number.isFinite(n))) return '';
 const y=parts[0],m=parts[1],d=parts[2];
 const total=(m-1)+Number(months||0);
 const ny=y+Math.floor(total/12), nm=(total%12)+1;
 const last=new Date(ny,nm,0).getDate();
 return `${ny}-${String(nm).padStart(2,'0')}-${String(Math.min(d,last)).padStart(2,'0')}`;
}

 // La renovación siempre añade la duración a la FECHA DE INICIO del cliente, no a la fecha del día ni a la caducidad actual.
 const startDate=String(u.start||'').slice(0,10);
 const baseDate=startDate || String(u.end||'').slice(0,10);
 const newEnd=addMonthsToDate(baseDate,months);
 if(!newEnd){toast('El cliente no tiene una fecha de inicio válida');return;}
 u.end=newEnd;
 if(price>0)u.price=price;
 state.renewalHistory=Array.isArray(state.renewalHistory)?state.renewalHistory:[];
 const renewalId=Date.now();
 state.renewalHistory.push({id:renewalId,userId:(u.id!=null&&u.id!=='')?u.id:null,user:u.user,date,renewalDate:date,months,price,newEnd:u.end,baseStart:baseDate});
 logActivity(`🔄 Renovado ${u.user} · ${months} meses · ${euro(price)}`,'renewal'); save().then(ok=>{ closeModal(); toast(ok?'Renovación guardada y sincronizada':'Renovación guardada localmente · error al sincronizar Firebase'); render('renewals'); });
}

function recalcEconomics(){
  const list=Array.isArray(state.credits)?state.credits:[];
  const paid=list.reduce((a,x)=>a+(Number(x.paid)||0),0);
  const credits=list.reduce((a,x)=>a+(Number(x.credits)||0),0);
  const lines=list.reduce((a,x)=>a+(Number(x.lines)||0),0);
  state.creditTotals={paid,credits,lines,avgCredit:credits?paid/credits:0,avgLine:lines?paid/lines:0};
  if(state.lineTotals) state.lineTotals.creditsPurchased=credits;
  return state.creditTotals;
}

 <div class="panel" style="margin-top:13px"><h2>💳 Historial de compras</h2><div class="tablewrap"><table class="table"><thead><tr><th data-view-key="date">Fecha</th><th data-view-key="paid">Pagado</th><th data-view-key="credits">Créditos</th><th data-view-key="lines">Líneas</th><th data-view-key="avgCredit">€/crédito</th><th data-view-key="avgLine">€/línea</th><th data-view-key="actions">Acciones</th></tr></thead><tbody>${state.credits.map((x,i)=>`<tr><td data-view-key="date">${fmt(x.date)}</td><td data-view-key="paid">${euro(x.paid)}</td><td data-view-key="credits">${num(x.credits)}</td><td data-view-key="lines">${num(x.lines)}</td><td data-view-key="avgCredit">${euro(x.paid/x.credits)}</td><td data-view-key="avgLine">${euro(x.paid/x.lines)}</td><td data-view-key="actions"><button class="btn small" onclick="editCreditPurchase(${i})">✏️ Editar</button></td></tr>`).join('')}</tbody><tfoot><tr><td>TOTAL</td><td>${euro(t.paid)}</td><td>${num(t.credits)}</td><td>${num(t.lines)}</td><td>${euro(t.avgCredit)}</td><td>${euro(t.avgLine)}</td></tr></tfoot></table></div></div>`;applyViewPrefs('credits');

function renewalDateParts(value){
 const m=String(value||'').slice(0,10).match(/^(\d{4})-(\d{2})-(\d{2})$/);
 return m?{year:Number(m[1]),month:Number(m[2])-1,day:Number(m[3])}:null;
}
function monthlyRenewalStats(monthIndex, year=TODAY.getFullYear()){
 const list=Array.isArray(state.renewalHistory)?state.renewalHistory:[];
 let income=0,count=0;
 list.forEach(x=>{
   const d=renewalDateParts(x.date||x.renewalDate);
   if(d && d.year===year && d.month===monthIndex){
     income+=Number(x.price)||0;
     count++;
   }
 });
 return {income,count};
}
function monthlyFinance(monthIndex){
 const s=state.sales||{income:[],expense:[],lines:[]};
 const r=monthlyRenewalStats(monthIndex);
 const income=(Number(s.income?.[monthIndex])||0)+r.income;
 const expense=Number(s.expense?.[monthIndex])||0;
 const clients=(Number(s.lines?.[monthIndex])||0);
 const benefit=income-expense;
 const avgClient=clients?benefit/clients:0;
 return {income,expense,clients,benefit,avgClient,renewals:r.count};
}

function finance(){
 let s=state.sales||{income:[],expense:[],lines:[]};
 let totalRenewals=Array.isArray(state.renewalHistory)?state.renewalHistory:[];
 let renewalIncome=totalRenewals.reduce((a,x)=>a+(Number(x.price)||0),0);
 let income=(s.income||[]).reduce((a,b)=>a+(Number(b)||0),0)+renewalIncome;
 let expense=(s.expense||[]).reduce((a,b)=>a+(Number(b)||0),0);
 let realBenefit=income-expense;
 let ct=recalcEconomics();
 let purchaseExpense=ct.paid;
 let freeCost=state.freeUsers.length*ct.avgLine;
 $('#content').innerHTML=header('Finanzas','Resumen Excel + renovaciones + compras reales de créditos',customButton('finance'))
 +`<div class="cards" data-view-key="summary"><div class="card"><div class="label">INGRESOS</div><div class="big orange">${euro(income)}</div></div><div class="card"><div class="label">GASTOS CRÉDITOS</div><div class="big red">${euro(purchaseExpense)}</div></div><div class="card"><div class="label">BENEFICIO REAL ESTIMADO</div><div class="big green">${euro(income-purchaseExpense)}</div></div><div class="card"><div class="label">COSTE EST. GRATIS ACTUALES</div><div class="big yellow">${euro(freeCost)}</div></div></div>
 <div class="panel" style="margin-top:13px" data-view-key="monthly"><h2>📅 Resumen mensual</h2><div class="tablewrap"><table class="table"><thead><tr><th>Mes</th><th>Cobrado</th><th>Gasto</th><th>Clientes</th><th>Renovaciones</th><th>Beneficio</th><th>Beneficio medio / cliente</th></tr></thead><tbody>${state.months.map((m,i)=>{let f=monthlyFinance(i);return `<tr><td><b>${m}</b></td><td>${euro(f.income)}</td><td>${euro(f.expense)}</td><td>${num(f.clients)}</td><td>${num(f.renewals)}</td><td>${euro(f.benefit)}</td><td><b>${euro(f.avgClient)}</b></td></tr>`}).join('')}</tbody></table></div></div>
 <div class="panel" style="margin-top:13px" data-view-key="evolution"><h2>📊 Evolución</h2>${state.months.map((m,i)=>{let f=monthlyFinance(i);let max=Math.max(...(s.income||[]).map(Number),f.income,1);return `<div class="row" style="margin:8px 0"><span style="width:95px">${m}</span><div style="flex:1"><div class="bar"><i style="width:${f.income/max*100}%"></i></div></div><b style="width:85px;text-align:right">${euro(f.income)}</b></div>`}).join('')}</div>`;const nowM=TODAY.getMonth(), prevM=(nowM+11)%12; const nowF=monthlyFinance(nowM), prevF=monthlyFinance(prevM);
 $('#content').insertAdjacentHTML('beforeend',`<div class="panel" style="margin-top:13px" data-view-key="comparison"><h2>📊 Comparativa mensual</h2><div class="compare-grid"><div class="mini-stat"><span class="small">${state.months[prevM]} → ${state.months[nowM]} · Beneficio</span><br><b>${euro(prevF.benefit)}</b> → <b class="green">${euro(nowF.benefit)}</b></div><div class="mini-stat"><span class="small">Clientes</span><br><b>${num(prevF.clients)}</b> → <b>${num(nowF.clients)}</b></div><div class="mini-stat"><span class="small">Ingresos</span><br><b>${euro(prevF.income)}</b> → <b class="orange">${euro(nowF.income)}</b></div></div></div>`); applyViewPrefs('finance');
}

function openUser(index=null, freeIndex=null){
 let isFree = freeIndex !== null && freeIndex !== undefined;
 let u;
 if(isFree){
   u=state.freeUsers[freeIndex];
 }else if(index !== null){

 }else{
   u={user:'',start:'2026-09-29',end:'',mac:'',mac2:'',price:0,k:''};
 }
 $('#modal').innerHTML=`<h2>${(index===null && !isFree)?'➕ Nuevo usuario':'✏️ Editar usuario'}</h2>
 <div class="form">

 ${(index!==null&&!isFree)?(()=>{const uid=state.users[index]?.id;const h=getActivity().filter(a=>a.text.includes(state.users[index]?.user||'')).slice(0,8);return `<div class="full" style="grid-column:1/-1"><label>📜 Historial del cliente</label><div class="history-box">${h.length?h.map(a=>`<div class="history-item">${new Date(a.date).toLocaleString('es-ES')} · ${esc(a.text)}</div>`).join(''):'<span class="small">Sin movimientos registrados.</span>'}</div></div>`})():''}
 <div class="modalfoot">
 <button class="btn" onclick="closeModal()">Cancelar</button>
 ${(index!==null || isFree)?`<button class="btn" style="background:#7f1d1d;border-color:#ef4444;color:#fff" onclick="deleteUser(${index===null?'null':index},${isFree?freeIndex:'null'})">🗑️ Eliminar</button>`:''}
 <button class="btn primary" onclick="saveUser(${index===null?'null':index},${isFree?freeIndex:'null'})">Guardar</button>
 </div>`;
 $('#modalbg').style.display='flex'
}
function saveUser(index, freeIndex=null){
 let isEditingFree = freeIndex !== null && freeIndex !== undefined;
 let isFree = $('#ffree').checked;
 let u={
   id:isEditingFree?state.freeUsers[freeIndex].id:(index===null?Date.now():state.users[index].id),
   user:$('#fuser').value.trim(),
   price:isFree?0:(Number($('#fprice').value)||0),
   start:$('#fstart').value,
   end:$('#fend').value,
   mac:$('#fmac').value.trim(),
   mac2:$('#fmac2').value.trim(),
   k:isFree?2:''
 };
 if(!u.user){toast('Falta el usuario');return}

 if(isEditingFree){
   state.freeUsers.splice(freeIndex,1);
   if(isFree) state.freeUsers.push(u);
   else state.users.push(u);
 }else if(index !== null){
   state.users.splice(index,1);
   if(isFree) state.freeUsers.push(u);
   else state.users.push(u);
 }else{
   if(isFree) state.freeUsers.push(u);
   else state.users.push(u);
 }
 logActivity(`${index===null && freeIndex===null?'➕ Nuevo cliente':'✏️ Cliente modificado'} · ${u.user}`,'client');
 save();
 closeModal();
 toast(isFree?'Usuario guardado como GRATIS':'Usuario guardado');
 render(isFree?'free':'users');
}
function deleteUser(index, freeIndex=null){
 let isFree = freeIndex !== null && freeIndex !== undefined;
 let arr = isFree ? state.freeUsers : state.users;
 let pos = isFree ? freeIndex : index;
 if(pos===null || pos===undefined || !arr[pos]) return;
 let name = arr[pos].user || 'este cliente';
 if(!confirm(`¿Seguro que quieres eliminar a ${name}?\n\nEsta acción eliminará el cliente de KIRA CONTROL.`)) return;
 arr.splice(pos,1);
 logActivity(`🗑️ Eliminado ${name}`,'delete');
 save();
 closeModal();
 toast('Cliente eliminado');
 render(isFree?'free':'users');
}

$('#modalbg').onclick=e=>{if(e.target.id==='modalbg')closeModal()}
